name: Compilar e publicar ERP

on:
  push:
    branches: [main]
    paths: [release-version.txt]
  workflow_dispatch:
    inputs:
      versao:
        description: 'Número da versão (ex.: 1.2.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publicar-erp
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Selecionar versão
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.versao }}
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'push') {
            (Get-Content release-version.txt -Raw).Trim()
          } else {
            $env:INPUT_VERSION
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use uma versão como 1.2.0.' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Configurar endereço da atualização
        run: python configurar_release.py $env:GITHUB_REPOSITORY $env:RELEASE_VERSION
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testar versão
        run: python -m unittest discover -q
      - name: Compilar EXE para Windows
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name ERP_Papeis_de_Marte --icon assets\marte.ico
          --add-data "assets\logo.png;assets"
          --add-data "assets\marte.ico;assets"
          --add-data "assets\update_config.json;assets"
          --collect-all openpyxl --collect-all reportlab app.py
      - name: Gerar arquivo de verificação
        run: python gerar_manifesto.py --repo $env:GITHUB_REPOSITORY
      - name: Publicar versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v$env:RELEASE_VERSION"
          "dist/ERP_Papeis_de_Marte.exe" "dist/update.json"
          --repo "$env:GITHUB_REPOSITORY" --latest
          --title "Papéis de Marte v$env:RELEASE_VERSION"
          --notes "Atualização do ERP Papéis de Marte."
